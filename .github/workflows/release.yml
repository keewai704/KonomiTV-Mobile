name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "MARKETING_VERSION=${version}" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "marketing_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Secrets cannot be referenced in `if`, so decide once and expose the
      # result as a step output. Any missing value falls back to an unsigned
      # simulator build instead of failing the release.
      - name: Detect signing credentials
        id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -n "$APPLE_TEAM_ID" ] \
            && [ -n "$BUILD_CERTIFICATE_BASE64" ] \
            && [ -n "$P12_PASSWORD" ] \
            && [ -n "$PROVISIONING_PROFILE_BASE64" ] \
            && [ -n "$ASC_KEY_ID" ] \
            && [ -n "$ASC_ISSUER_ID" ] \
            && [ -n "$ASC_PRIVATE_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "All signing secrets found; building a signed App Store IPA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete; building an unsigned simulator app." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run UI tests against the mock server
        env:
          TEST_RUNNER_KONOMITV_SERVER_URL: http://127.0.0.1:7010
        run: |
          set -euo pipefail
          python3 MockServer/mock_server.py --port 7010 > "$RUNNER_TEMP/mock-server.log" 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > "$RUNNER_TEMP/mock-server.pid"
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:7010/api/version >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:7010/api/version >/dev/null

          xcodebuild test \
            -project KonomiTV.xcodeproj \
            -scheme KonomiTV \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=26.5" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults-release.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Install signing certificate and provisioning profile
        if: steps.signing.outputs.signed == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-keychain
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security set-keychain-settings -u -t 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046 # word splitting is intended here
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          mkdir -p "$PROFILE_DIR"
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive and export signed IPA
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.github.keewai704.KonomiTV</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild archive \
            -project KonomiTV.xcodeproj \
            -scheme KonomiTV \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/KonomiTV.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-archive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KonomiTV.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

          IPA_PATH=$(find "$RUNNER_TEMP/export" -name '*.ipa' -type f | head -n 1)
          test -n "$IPA_PATH"
          cp "$IPA_PATH" "$RUNNER_TEMP/KonomiTV-$MARKETING_VERSION.ipa"

      - name: Upload to App Store Connect
        if: steps.signing.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"

          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          fi

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/KonomiTV-$MARKETING_VERSION.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Publish signed IPA to GitHub Release
        if: steps.signing.outputs.signed == 'true' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/KonomiTV-$MARKETING_VERSION.ipa" \
            --clobber

      - name: Upload signed IPA artifact
        if: steps.signing.outputs.signed == 'true' && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: KonomiTV-${{ steps.version.outputs.marketing_version }}.ipa
          path: ${{ runner.temp }}/KonomiTV-${{ steps.version.outputs.marketing_version }}.ipa
          retention-days: 7

      - name: Build unsigned simulator app
        if: steps.signing.outputs.signed != 'true'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project KonomiTV.xcodeproj \
            -scheme KonomiTV \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-unsigned" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH="$RUNNER_TEMP/DerivedData-unsigned/Build/Products/Release-iphonesimulator/KonomiTV.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$RUNNER_TEMP/KonomiTV-$MARKETING_VERSION-simulator.zip"

      - name: Publish unsigned simulator app to GitHub Release
        if: steps.signing.outputs.signed != 'true' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/KonomiTV-$MARKETING_VERSION-simulator.zip" \
            --clobber

      - name: Upload unsigned simulator app artifact
        if: steps.signing.outputs.signed != 'true' && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: KonomiTV-${{ steps.version.outputs.marketing_version }}-simulator
          path: ${{ runner.temp }}/KonomiTV-${{ steps.version.outputs.marketing_version }}-simulator.zip
          retention-days: 7

      - name: Upload mock server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-server-log-release
          path: ${{ runner.temp }}/mock-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "$ASC_KEY_ID" ]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
