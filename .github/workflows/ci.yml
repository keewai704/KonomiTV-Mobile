name: CI

on:
  push:
    branches: [main, feat/ios-client]
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-linux:
    name: KonomiKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run Swift package tests
        working-directory: Packages/KonomiKit
        run: swift test

  mock-server:
    name: Mock server (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run mock server unit tests
        working-directory: MockServer
        run: python3 -m unittest discover -v

  # Builds the app and the UI test runner once; the E2E jobs only install
  # and run them.
  build:
    name: Build for testing
    runs-on: macos-26
    timeout-minutes: 60
    needs: [package-linux, mock-server]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Xcode project
        id: prepare
        uses: ./.github/actions/prepare-xcode-project
        with:
          cache-name: simulator

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project KonomiTV.xcodeproj \
            -scheme KonomiTV \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Save compilation cache
        if: steps.prepare.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: ${{ steps.prepare.outputs.cache-key }}

      # upload-artifact drops file modes (the app and runner executables), so
      # the products travel as a tar. The .xctestrun refers to them relative
      # to its own directory.
      - name: Package test products
        run: |
          tar -C "$RUNNER_TEMP/DerivedData/Build" -cf "$RUNNER_TEMP/test-products.tar" Products
          ls -lh "$RUNNER_TEMP/test-products.tar"

      - name: Upload test products
        uses: actions/upload-artifact@v4
        with:
          name: test-products
          path: ${{ runner.temp }}/test-products.tar
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 120
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone 17
            slug: iphone-17
            only-testing: ""
          # Only the suites whose behavior depends on the regular width layout
          # (and PiP, which the iPhone simulator lacks).
          - device: iPad Pro 13-inch (M5)
            slug: ipad-pro-13-inch-m5
            only-testing: >-
              -only-testing:KonomiTVUITests/LayoutUITests
              -only-testing:KonomiTVUITests/PlaybackUITests
              -only-testing:KonomiTVUITests/TimeTableUITests
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # Booting before the download overlaps the slow first boot with it, and
      # avoids "Timed out while launching application" on the first UI test.
      - name: Boot simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if k.endswith("iOS-26-5") for x in v if x["name"]==sys.argv[1]))' "$DEVICE")
          xcrun simctl boot "$udid" || true
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Start mock server
        run: |
          set -euo pipefail
          cd MockServer
          nohup python3 mock_server.py --port 7010 > "$RUNNER_TEMP/mock-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mock-server.pid"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:7010/api/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Mock server did not become ready" >&2
          exit 1

      - name: Download test products
        uses: actions/download-artifact@v4
        with:
          name: test-products
          path: ${{ runner.temp }}

      - name: Unpack test products
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/TestProducts"
          tar -C "$RUNNER_TEMP/TestProducts" -xf "$RUNNER_TEMP/test-products.tar"
          xctestrun=$(find "$RUNNER_TEMP/TestProducts/Products" -maxdepth 1 -name '*.xctestrun' | head -n 1)
          test -n "$xctestrun"
          echo "XCTESTRUN=$xctestrun" >> "$GITHUB_ENV"

      - name: Wait for simulator
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      # The app (and each test, at its start) logs to this subsystem; the
      # report below prints the lines of every failed test.
      - name: Stream app log
        run: |
          nohup xcrun simctl spawn "$SIMULATOR_UDID" log stream \
            --level debug --style compact \
            --predicate 'subsystem == "com.github.keewai704.KonomiTV"' \
            > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app-log.pid"

      # The failure report is part of this step so `gh run view --log-failed`
      # shows it next to the xcodebuild output.
      - name: Run UI tests
        env:
          TEST_RUNNER_KONOMITV_SERVER_URL: http://127.0.0.1:7010
          ONLY_TESTING: ${{ matrix.only-testing }}
          RESULT_BUNDLE: ${{ runner.temp }}/TestResults-${{ matrix.slug }}.xcresult
        run: |
          status=0
          # shellcheck disable=SC2086 # ONLY_TESTING holds separate flags
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            $ONLY_TESTING || status=$?
          python3 scripts/report-ui-tests.py "$RESULT_BUNDLE" "$RUNNER_TEMP/app.log"
          exit "$status"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.slug }}
          path: ${{ runner.temp }}/TestResults-${{ matrix.slug }}.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/mock-server.log
            ${{ runner.temp }}/app.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop background processes
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP/mock-server.pid" "$RUNNER_TEMP/app-log.pid"; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

  # Runs beside the build, not after the tests: the IPA is useful from a red
  # run too. Release device builds keep their own compilation cache.
  ipa:
    name: Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    needs: [package-linux, mock-server]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Xcode project
        id: prepare
        uses: ./.github/actions/prepare-xcode-project
        with:
          cache-name: device

      - name: Build unsigned IPA
        run: |
          scripts/build-unsigned-ipa.sh \
            "$RUNNER_TEMP/KonomiTV-unsigned.ipa" \
            "0.0.${{ github.run_number }}" \
            "${{ github.run_number }}"

      - name: Save compilation cache
        if: steps.prepare.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: ${{ steps.prepare.outputs.cache-key }}

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KonomiTV-unsigned-ipa
          path: ${{ runner.temp }}/KonomiTV-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
