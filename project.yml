name: KonomiTV

options:
  bundleIdPrefix: com.github.keewai704
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

packages:
  KonomiKit:
    path: Packages/KonomiKit
  ARIBCaption:
    path: Packages/ARIBCaption

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  KonomiTV:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/KonomiTV
        excludes:
          - "Info.plist"
    dependencies:
      - package: KonomiKit
        product: KonomiKit
      - package: KonomiKit
        product: KonomiStreaming
      - package: ARIBCaption
        product: ARIBCaption
    info:
      path: App/KonomiTV/Info.plist
      properties:
        CFBundleDisplayName: KonomiTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 同じネットワーク上のKonomiTVサーバーに接続して、テレビ放送やビデオを再生します。
        NSPhotoLibraryAddUsageDescription: キャプチャした画像を写真ライブラリに保存します。
    settings:
      base:
        PRODUCT_NAME: KonomiTV
        PRODUCT_BUNDLE_IDENTIFIER: com.github.keewai704.KonomiTV
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(KONOMITV_DEVELOPMENT_TEAM)"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO

  KonomiTVUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/KonomiTVUITests
    dependencies:
      - target: KonomiTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.keewai704.KonomiTVUITests
        PRODUCT_NAME: KonomiTVUITests
        TEST_TARGET_NAME: KonomiTV
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(KONOMITV_DEVELOPMENT_TEAM)"
        # XCTest's UI APIs are main-actor isolated while XCTestCase lifecycle
        # methods are not; Swift 5 mode keeps the test code free of that friction.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  KonomiTV:
    build:
      targets:
        KonomiTV: all
        KonomiTVUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - KonomiTVUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
